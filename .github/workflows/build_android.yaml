name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "echo" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'
  pull_request:
    branches: [ "main", "echo" ]
    paths:
      - 'Android/**'

jobs:
  lint_and_test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Lint
        run: ./gradlew lintDebug --continue

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: Android/src/app/build/reports/lint-results*.html
          retention-days: 14

      - name: Run Unit Tests
        run: ./gradlew test --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Android/src/app/build/reports/tests/
          retention-days: 14

  build_apk:
    name: Build Echo APK
    needs: lint_and_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    env:
      SIGNING_KEYSTORE_PATH: /tmp/echo-release.jks
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode signing keystore
        if: ${{ env.SIGNING_KEYSTORE_PASSWORD != '' }}
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > /tmp/echo-release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Rename APK with version info
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/echo-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.short_sha }}-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-release-apk
          path: Android/src/app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build_apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/echo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' Android/src/app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' Android/src/app/build.gradle.kts)
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: echo-release-apk
          path: ./apk

      - name: Delete existing release for this version (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}"
          gh release create "$TAG" \
            --title "Echo ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})" \
            --notes "**Echo v${{ steps.version.outputs.version_name }}** (versionCode: ${{ steps.version.outputs.version_code }})

          Commit: ${{ github.sha }}
          Branch: echo

          ---
          _This release was created automatically. Install the APK on your Android device to update._" \
            ./apk/*.apk
